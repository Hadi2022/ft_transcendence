openapi: 3.1.2

info:
  title: Transcendence API
  version: 0.1.0
  description: REST API for the ft_transcendence project

servers:
  - url: /api
    description: API base path

paths:
  /status:
    get:
      tags:
        - System
      summary: Get API status
      description: Returns the current availability status of the API
      operationId: getApiStatus
      security: []

      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
              example:
                data:
                  status: ok
  /sessions:
    post:
      summary: User login endpoint
      description: Creates and returns a new session as cookie
      operationId: openSession
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password

      responses:
        '201': 
          description: Session was created, Set-Cookie header has been returned
        '401':
          description: To be implemented
        '409':
          description: To be implemented
  
  /sessions/current:
    delete:
      summary: Close the current session
      operationId: closeCurrentSession
      responses:
        '204':
          description: Session closed, or no current session exists.

  /sessions/{id}:
    delete:
      summary: Close a session by ID
      operationId: closeSession
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the session to close.
          schema:
            type: string
      responses:
        '204':
          description: Session successfully closed.