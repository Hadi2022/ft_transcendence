openapi: 3.1.2

info:
  title: Transcendence API
  version: 0.1.0
  description: REST API for the ft_transcendence project

servers:
  - url: /api
    description: API base path

paths:
  /status:
    get:
      tags:
        - System
      summary: Get API status
      description: Returns the current availability status of the API
      operationId: getApiStatus
      security: []

      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
              example:
                data:
                  status: ok
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google:
    get:
      tags:
        - Authentication
      summary: Start Google OAuth authorization
      description: >-
        Redirects the browser to Google for authentication.
        Sets a temporary HttpOnly cookie containing the OAuth state
        used to validate the callback. Does not require a local session.
      operationId: authorizeGoogle
      security: []

      responses:
        '302':
          description: Redirect to Google's authorization endpoint
          headers:
            Location:
              description: Google authorization URL
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: Temporary OAuth state cookie
              required: true
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Handle Google OAuth callback
      description: >-
        Validates the OAuth state, exchanges the authorization code
        for Google tokens and verifies the Google ID token.
        The current implementation returns a temporary success response.
        It does not create a local user or session.
      operationId: googleCallback
      security: []

      parameters:
        - name: state
          in: query
          required: false
          description: State value returned by Google
          schema:
            type: string
        - name: code
          in: query
          required: false
          description: Authorization code returned by Google on success
          schema:
            type: string
        - name: error
          in: query
          required: false
          description: Error returned by Google when authorization fails
          schema:
            type: string

      responses:
        '200':
          description: Google identity successfully verified
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    const: true
                  message:
                    type: string
              example:
                success: true
                message: Google identity verified successfully

        '400':
          description: Invalid state, missing code or denied authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidState:
                  summary: Invalid OAuth state
                  value:
                    error:
                      code: INVALID_OAUTH_STATE
                      message: Invalid or missing OAuth state
                      details: {}
                missingCode:
                  summary: Missing authorization code
                  value:
                    error:
                      code: MISSING_AUTHORIZATION_CODE
                      message: Missing Google authorization code
                      details: {}
                deniedAuthorization:
                  summary: Google authorization denied
                  value:
                    error:
                      code: GOOGLE_AUTHORIZATION_DENIED
                      message: Google authorization was not completed
                      details: {}

        '401':
          description: Google authorization code or identity verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: GOOGLE_AUTHENTICATION_FAILED
                  message: Google authentication could not be completed
                  details: {}

        '500':
          $ref: '#/components/responses/InternalServerError'

        '502':
          description: Google authentication provider failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: GOOGLE_PROVIDER_ERROR
                  message: Google authentication service is unavailable
                  details: {}

  /sessions:
    post:
      summary: User login endpoint
      description: Creates a new session and returns a cookie
      operationId: openSession
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  description: Email
                  type: string
                password:
                  type: string
                  format: password
            example:
              email: john.doe@selfhosted.es
              password: s3cret-passw0rd

      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              description: Session cookie
              required: true
              schema:
                type: string
        '400':
          description: Request contains invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Input contains invalid fields
                  details:
                    password: Password is required.
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Invalid credentials
                  details: {}
        '409':
          description: Session already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: CONFLICT
                  message: You are already logged in
                  details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Get user sessions
      description: Returns all sessions of the logged in user
      operationId: getSessions
      security:
        - sessionCookie: []

      responses:
        '200':
          description: Sessions returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
              example:
                data:
                  - id: 3f9c2b7e-5d1a-4c8b-9e2f-7a6b1d0c4e83
                    current: true
                  - id: a41d80c5-92b7-4f3e-8a15-c0d9e6b72f14
                    current: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Close all user sessions
      description: Closes all sessions of the logged in user and clears the cookie
      operationId: closeAllUserSessions
      security:
        - sessionCookie: []

      responses:
        '204':
          description: All sessions closed
          headers:
            Set-Cookie:
              description: Clears the session cookie
              required: true
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/current:
    delete:
      summary: Close the current session
      description: Closes the current session and clears the cookie
      operationId: closeCurrentSession
      security:
        - sessionCookie: []

      responses:
        '204':
          description: Session closed
          headers:
            Set-Cookie:
              description: Clears the session cookie
              required: true
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sessions/{id}:
    delete:
      summary: Close a session by ID
      description: >-
        Closes a session belonging to the logged in user. If the closed
        session is the current one, the cookie is cleared as well.
      operationId: closeSession
      security:
        - sessionCookie: []

      parameters:
        - name: id
          in: path
          required: true
          description: ID of the session to close
          schema:
            type: string
            format: uuid

      responses:
        '204':
          description: Session closed
          headers:
            Set-Cookie:
              description: >-
                Clears the session cookie. Only present when the closed
                session was the current one.
              required: false
              schema:
                type: string
        '400':
          description: Invalid session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Invalid UUID in route parameter
                  details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Session could not be found
                  details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    post:
      summary: Register a new user
      description: Creates a new user account from a username, email and password
      operationId: registerUser
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  description: Unique username
                email:
                  type: string
                  format: email
                  description: Unique email address
                password:
                  type: string
                  format: password
            example:
              username: jdoe
              email: jdoe@example.com
              password: s3cret-passw0rd

      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
              example:
                data:
                  id: f659603a-e5dc-45be-bf70-21390457357e
                  username: jdoe
                  name: null
                  biography: null
                  avatarUrl: null
                  isVerified: false
                  createdAt: '2026-10-31T12:00:00.000Z'
        '400':
          description: Request contains invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Input contains invalid fields
                  details:
                    email: Invalid email address.
        '409':
          description: Username or email is already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailConflict:
                  summary: Email already registered
                  value:
                    error:
                      code: CONFLICT
                      message: User already exists
                      details:
                        email: email is in use
                usernameConflict:
                  summary: Username already taken
                  value:
                    error:
                      code: CONFLICT
                      message: User already exists
                      details:
                        username: username is in use
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      summary: Retrieve a list of users 
      description: Returns a list of users, by default, sorted by creation time in descending order
      operationId: getUserList
      security: []

      parameters:
        - name: order
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: desc

        - name: order_by
          in: query
          required: false
          description: Field used to sort users
          schema:
            type: string
            enum: [created_at, username]
            default: created_at

      responses:
        '200':
          description: Sucessfully returned list of users 
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required: 
                      - users
                    properties: 
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid ordering query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Invalid query parameters
                  details:
                    order: Invalid option
        '500':
          $ref: '#/components/responses/InternalServerError'


  /users/me:
    get:
      summary: Get the current user
      description: Returns the profile of the user who owns the current session
      operationId: getCurrentUser
      security:
        - sessionCookie: []

      responses:
        '200':
          description: Current user returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OwnProfile'
              example:
                data:
                  id: 3f9c2b7e-5d1a-4c8b-9e2f-7a6b1d0c4e83
                  username: hadi
                  email: hadi@selfhosted.selfhostingiscool
                  name: hadi
                  biography: I hate big tech
                  avatarUrl: https://example.com/avatars/hadi.png
                  isVerified: false
                  createdAt: '2026-10-31T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: You do not exist! (wow!)
                  details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      summary: Update the current user profile
      description: Updates one or more editable profile fields of the logged in user
      operationId: updateCurrentUser
      security:
        - sessionCookie: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: [string, 'null']
                  maxLength: 100
                  description: Display name
                biography:
                  type: [string, 'null']
                avatarUrl:
                  type: [string, 'null']
                  format: uri
                  maxLength: 500
            example:
              name: CrazyIgor
              biography: Updated profile biography

      responses:
        '200':
          description: User profile updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OwnProfile'
              example:
                data:
                  id: 3f9c2b7e-5d1a-4c8b-9e2f-7a6b1d0c4e83
                  username: hadi
                  email: hadi@selfhosted.selfhostingiscool
                  name: CrazyIgor
                  biography: Updated profile biography
                  avatarUrl: null
                  isVerified: false
                  createdAt: '2026-10-31T12:00:00.000Z'

        '400':
          description: Invalid profile fields or empty request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Input contains invalid fields
                  details:
                    _root: At least one field must be provided

        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: You do not exist! (wow!)
                  details: {}
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      summary: Get a user by ID
      description: Returns the public profile of a user by their UUID
      operationId: getUserById
      security: []

      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user to retrieve
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: User profile returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
              example:
                data:
                  id: 2c5e3619-cbed-4a02-a1e3-9807f0b2989c
                  username: alejandro_test
                  name: null
                  biography: null
                  avatarUrl: null
                  isVerified: false
                  createdAt: '2026-10-31T17:10:37.131Z'

        '400':
          description: Invalid user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Invalid user ID
                  details:
                    id: User ID must be a valid UUID

        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: User not found
                  details: {}

        '500':
          $ref: '#/components/responses/InternalServerError'

  /friend-requests:
    post:
      summary: Send or accept a friend request
      description: >-
        Sends a friend request from the logged in user to the receiver. If the
        receiver has already sent a pending request to the logged in user, that
        request is accepted instead and the two users become friends.
      operationId: openFriendRequest
      security:
        - sessionCookie: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiverId
              properties:
                receiverId:
                  type: string
                  format: uuid
                  description: ID of the user to send the friend request to
            example:
              receiverId: 2c5e3619-cbed-4a02-a1e3-9807f0b2989c

      responses:
        '200':
          description: >-
            The receiver had already sent a pending request, which is now
            accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/FriendRequest'
              example:
                data:
                  id: 7b0e5a52-3c4d-4d1e-8f6a-1d2c9e3b5a47
                  senderId: 2c5e3619-cbed-4a02-a1e3-9807f0b2989c
                  receiverId: 3f9c2b7e-5d1a-4c8b-9e2f-7a6b1d0c4e83
                  status: accepted
                  createdAt: '2026-11-03T12:00:00.000Z'
        '201':
          description: Friend request created and pending
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/FriendRequest'
              example:
                data:
                  id: 7b0e5a52-3c4d-4d1e-8f6a-1d2c9e3b5a47
                  senderId: 3f9c2b7e-5d1a-4c8b-9e2f-7a6b1d0c4e83
                  receiverId: 2c5e3619-cbed-4a02-a1e3-9807f0b2989c
                  status: pending
                  createdAt: '2026-11-03T12:00:00.000Z'
        '400':
          description: Request contains invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: Input contains invalid fields
                  details:
                    receiverId: User id has to be valid UUID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Receiver does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Resource not found
                  details:
                    reason: cannot send friend request because the user does not exist
        '409':
          description: The friend request conflicts with the current state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                self:
                  summary: Sender and receiver are the same user
                  value:
                    error:
                      code: CONFLICT
                      message: Conflict
                      details:
                        reason: Cannot friend yourself
                alreadyFriends:
                  summary: Users are already friends
                  value:
                    error:
                      code: CONFLICT
                      message: Conflict
                      details:
                        reason: Already friends
                requestExists:
                  summary: A request from the sender is already open
                  value:
                    error:
                      code: CONFLICT
                      message: Conflict
                      details:
                        reason: Friend request already open
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get pending friend requests
      description: >-
        Returns all pending friend requests received by the logged in user.
        The authenticated user is matched against the receiverId field.
      operationId: getFriendRequests
      security:
        - sessionCookie: []

      responses:
        '200':
          description: Pending friend requests returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendRequest'
              example:
                data:
                  - id: 62f19da2-4142-4a61-9f6b-a353dc9e9337
                    senderId: 32a92853-3745-42c2-a08b-998d4187aae6
                    receiverId: c86c401f-7405-456f-ab6f-0ad2ffa2f462
                    status: pending
                    createdAt: '2026-11-04T13:28:22.339Z'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '500':
          $ref: '#/components/responses/InternalServerError'


components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionID

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: You are not authorized to access this resource
              details: {}

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: Internal server error
              details: {}

  schemas:
    UserProfile:
      type: object
      description: Public profile of a user. Does not include the email address.
      required:
        - id
        - username
        - name
        - biography
        - avatarUrl
        - isVerified
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: User ID represented as UUID
        username:
          type: string
          maxLength: 30
        name:
          type: [string, 'null']
          maxLength: 100
          description: Display name
        biography:
          type: [string, 'null']
        avatarUrl:
          type: [string, 'null']
          maxLength: 500
        isVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OwnProfile:
      description: Profile of the logged in user. Public profile plus the email address.
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email

    FriendRequest:
      type: object
      description: A friend request between two users, pending or accepted
      required:
        - id
        - senderId
        - receiverId
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: Friend request ID
        senderId:
          type: string
          format: uuid
          description: ID of the user who sent the request
        receiverId:
          type: string
          format: uuid
          description: ID of the user who received the request
        status:
          type: string
          enum:
            - pending
            - accepted
        createdAt:
          type: string
          format: date-time

    Session:
      type: object
      required:
        - id
        - current
      properties:
        id:
          type: string
          format: uuid
          description: Session ID
        current:
          type: boolean
          description: Whether this is the current session

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Per-field error messages, keyed by field name. Empty when the error is not tied to specific fields
              additionalProperties:
                type: string

    ErrorCode:
      type: string
      description: >-
        Machine-readable error code. Clients must tolerate unknown
        values and fall back to the HTTP status and message.
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - NOT_FOUND
        - CONFLICT
        - INTERNAL
        - INVALID_OAUTH_STATE
        - MISSING_AUTHORIZATION_CODE
        - GOOGLE_AUTHORIZATION_DENIED
        - GOOGLE_AUTHENTICATION_FAILED
        - GOOGLE_PROVIDER_ERROR
      x-enumDescriptions:
        BAD_REQUEST: Request failed validation.
        UNAUTHORIZED: Missing or invalid session, or wrong credentials.
        NOT_FOUND: The referenced resource does not exist.
        CONFLICT: The request conflicts with current state (session or user already exists, or the friend request is not allowed).
        INTERNAL: Unexpected server failure.
        INVALID_OAUTH_STATE: Missing or invalid OAuth state.
        MISSING_AUTHORIZATION_CODE: Google callback has no authorization code.
        GOOGLE_AUTHORIZATION_DENIED: Google authorization was not completed.
        GOOGLE_AUTHENTICATION_FAILED: Google authentication or identity verification failed.
        GOOGLE_PROVIDER_ERROR: Google authentication provider failed.
