openapi: 3.1.2

info:
  title: Transcendence API
  version: 0.1.0
  description: REST API for the ft_transcendence project

servers:
  - url: /api
    description: API base path

paths:
  /status:
    get:
      tags:
        - System
      summary: Get API status
      description: Returns the current availability status of the API
      operationId: getApiStatus
      security: []

      responses:
        '200':
          description: API is operational
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
              example:
                data:
                  status: ok

  /sessions:
    post:
      summary: User login endpoint
      description: Creates a new session and returns a cookie
      operationId: openSession
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  description: Email or username
                  type: string
                password:
                  type: string
                  format: password

      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              description: Session cookie
              required: true
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Invalid credentials
        '409':
          description: Session already exists

    get:
      summary: Get user sessions
      description: Returns all sessions of the logged in user
      operationId: getSessions
      security:
        - sessionCookie: []

      responses:
        '200':
          description: Sessions returned
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - current
                      properties:
                        id:
                          type: string
                          description: Session ID
                        current:
                          type: boolean
                          description: Whether this is the current session
        '401':
          description: Unauthorized

    delete:
      summary: Close all user sessions
      description: Closes all sessions of the logged in user
      operationId: closeAllUserSessions
      security:
        - sessionCookie: []

      responses:
        '204':
          description: All sessions closed
        '401':
          description: Unauthorized

  /sessions/current:
    delete:
      summary: Close the current session
      description: Closes the current session and clears the cookie
      operationId: closeCurrentSession
      security:
        - sessionCookie: []

      responses:
        '204':
          description: Session closed
        '401':
          description: Unauthorized

  /sessions/{id}:
    delete:
      summary: Close a session by ID
      description: Closes a session belonging to the logged in user
      operationId: closeSession
      security:
        - sessionCookie: []

      parameters:
        - name: id
          in: path
          required: true
          description: ID of the session to close
          schema:
            type: string

      responses:
        '204':
          description: Session closed
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '404':
          description: Session not found

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionID